run_name: "glaucoma-3dcnn"
seed: 42

model:
  type: "glaucoma"
  architecture: "simple3dcnn"
  input_channels: 1
  num_classes: 2
  dropout: 0.3
  hidden: [16, 32, 64, 128]
  norm: "group"
  norm_groups: 8
  pool_strides: [[2, 2, 1], [2, 2, 1], [2, 2, 1], [2, 2, 1]]
  pool_type: "max"
  residual: true

data:
  data_dir: "glaucoma_all"
  cache_in_ram: false
  num_workers: auto
  normalize: "minmax"

train:
  epochs: 30
  batch_size: 2
  grad_accum_steps: 4
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  amp: true
  compile: false
  log_every_steps: 10
  eval_every_steps: 100
  eval_test_every_steps: 500
  save_every_steps: 500
  keep_last_checkpoints: 2
  early_stop_patience: 5

logging:
  tensorboard: true
  jsonl: true
  wandb: true
  wandb_project: "glaucoma-thesis"
  plot_curves: true
  drive_sync_dir: ""

output_dir: "outputs"

smoke:
  max_train_samples: 32
  max_val_samples: 16
  epochs: 1
  batch_size: 2
  log_every_steps: 1
  eval_every_steps: 4
  save_every_steps: 4

sanity:
  max_train_samples: 10
  max_val_samples: 0
  epochs: 100
  batch_size: 1
  log_every_steps: 1
  eval_every_steps: 999999
  save_every_steps: 999999

hf:
  use_auth: true
  fast_transfer: true
