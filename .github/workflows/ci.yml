name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check pipeline models tests
      - name: Tests
        run: pytest tests -q

  smoke-train:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -e ".[glaucoma]"
      - name: Smoke train (glaucoma, CPU)
        run: |
          python -m pipeline.train --cfg configs/glaucoma.yaml --smoke --output-dir /tmp/smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
